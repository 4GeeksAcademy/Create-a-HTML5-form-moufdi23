<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://kit.fontawesome.com/d3564a63e2.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="container mb-3">
      <form class="border rounded mt-3">
        <div class="row">
          <div class="col">
            <h1 class="bg-secondary-subtle py-4">Payment Form example</h1>

            <div class="p-4">
              <strong>
                <p class="bg-danger-subtle text-danger py-3 rounded px-3">
                  Some fields are missing
                </p></strong
              >
            </div>
          </div>
          <div class="row ms-1">
            <div class="col-5">
              <label for="number" class="form-label">#card</label>
              <input
                type="number"
                class="form-control"
                name="number"
                placeholder="xxxxxxxxxxxxxxxx"
              />
            </div>
            <div class="col-3">
              <label for="number" class="form-label">#CVC</label>
              <input
                type="number"
                class="form-control"
                name="number"
                placeholder="0000"
              />
            </div>
            <div class="col-4">
              <label for="number" class="form-label">#Amount</label>

              <div class="d-flex">
                <b>$</b>
                <input
                  type="number"
                  class="form-control"
                  name="number"
                  placeholder="Amount"
                />
              </div>
            </div>
          </div>
          <div class="row ms-1">
            <div class="col-6">
              <label for="text" class="form-label">First Name</label>
              <input type="text" class="form-control" name="number" />
            </div>
            <div class="col-6">
              <label for="text" class="form-label">Last Name</label>
              <input type="text" class="form-control" name="number" />
            </div>
          </div>
          <div class="row between ms-1">
            <div class="col-6">
              <label for="text" class="form-label">City</label>
              <input type="text" class="form-control" name="text" />
            </div>

            <div class="col-3">
              <label for="text" class="form-label">State</label>
              <input
                type="text"
                class="form-select"
                name="text"
                placeholder="Pick a state"
              />
            </div>
            <div class="col-3">
              <label for="number" class="form-label">Postal Code</label>
              <input type="number" class="form-control" name="number" />
            </div>
          </div>
          <div class="row ms-1">
            <div class="col-6">
              <div class="my-3"><p>We Accept:</p></div>

              <div class="bg-secondary w-50 p-2 rounded">
                <div class="form-check form-check-inline">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="inlineCheckbox1"
                    value="option1"
                  />
                  <label class="form-check-label" for="inlineCheckbox1"
                    ><i class="fa-brands fa-cc-visa"></i
                  ></label>
                </div>
                <div class="form-check form-check-inline">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="inlineCheckbox2"
                    value="option2"
                  />
                  <label class="form-check-label" for="inlineCheckbox2"
                    ><i class="fa-brands fa-cc-mastercard"></i
                  ></label>
                </div>
                <div class="form-check form-check-inline">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="inlineCheckbox3"
                    value="option3"
                  />
                  <label class="form-check-label" for="inlineCheckbox3">
                    <i class="fa-brands fa-cc-stripe"></i
                  ></label>
                </div>
                <div class="form-check form-check-inline">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="inlineCheckbox3"
                    value="option3"
                  />
                  <label class="form-check-label" for="inlineCheckbox3">
                    <i class="fa-brands fa-cc-paypal"></i
                  ></label>
                </div>
              </div>
            </div>

            <div class="col-6 justify-content-end my-3">
              <label for="text" class="form-label">Message</label>
              <textarea
                type="text"
                class="form-control"
                name="text"
                style="height: 100px"
              ></textarea
              ><span>Add any notes here.</span>
            </div>
          </div>
        </div>
        <div class="bg-secondary-subtle">
          <div class="d-flex justify-content-end p-3">
            <button class="btn btn-secondary rounded me-3">Cancel</button>

            <button class="btn btn-primary rounded">Send</button>
          </div>
        </div>

        <script
          src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
          crossorigin="anonymous"
        ></script>
      </form>
    </div>
  </body>
</html>
